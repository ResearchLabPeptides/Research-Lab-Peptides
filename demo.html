<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futurelite 2.0 — Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --background:#f7f8fa;--foreground:#0b1220;--card:#fff;--primary:#0f7b5a;--primary-fg:#fff;
  --warning:#e0a106;--muted:#edf0f4;--muted-fg:#5b6472;--border:#e3e7ec;--accent:#e6f4ee;
  --radius:12px;--font-body:'Inter';--font-display:'Bricolage Grotesque';--font-mono:'JetBrains Mono';
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font-family:var(--font-body),system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
h1,h2,h3{font-family:var(--font-display),var(--font-body),sans-serif;letter-spacing:-.02em}
.mono{font-family:var(--font-mono),ui-monospace,monospace}
.tabular{font-variant-numeric:tabular-nums;font-family:var(--font-mono),ui-monospace,monospace}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{padding:8px 14px;border-radius:calc(var(--radius) - 4px);font-size:13px;font-weight:600;
  background:var(--primary);color:var(--primary-fg);display:inline-flex;align-items:center;gap:6px;
  justify-content:center;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--foreground);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--muted-fg)}
.btn-danger{background:#b42318;color:#fff}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-lg{padding:12px 18px;font-size:14px;width:100%}

.chrome{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.badge-demo{font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:var(--primary);
  color:var(--primary-fg);padding:4px 8px;border-radius:99px;font-weight:700}
.tabs{display:flex;gap:3px;background:var(--muted);padding:3px;border-radius:10px}
.tabs button{padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted-fg)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chrome-right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.drawer{position:fixed;top:0;right:0;height:100dvh;width:350px;background:var(--card);
  border-left:1px solid var(--border);z-index:80;overflow-y:auto;padding:18px;transform:translateX(100%);
  transition:transform .25s ease;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.open{transform:translateX(0)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:none}
.scrim.open{display:block}

.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hint{font-size:12px;color:var(--muted-fg);line-height:1.5}
.sect{border-top:1px solid var(--border);margin:16px 0 12px;padding-top:12px;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted-fg);font-weight:700}

.field{margin-bottom:11px}
.flabel{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);
  border-radius:calc(var(--radius) - 4px);background:var(--background);font-size:13px}
.fhint{font-size:11px;color:var(--muted-fg);margin-top:4px}
.err{font-size:11px;font-weight:600;color:#b42318;margin-top:4px}
.field input[aria-invalid=true]{border-color:#b42318}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* City, province and postal on one line. Postal is always six characters, so it
   gives its spare width to the two fields that actually need it. */
.grid-cpp{display:grid;grid-template-columns:72px minmax(0,1fr) 76px;gap:7px}
/* The province select carries the longest text in the row, so it keeps its
   width and gives up its padding instead. */
.grid-cpp select{padding-left:8px;padding-right:4px}
.grid-cpp select,.grid-cpp input{min-width:0}
.check{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.check input{margin-top:2px;accent-color:var(--primary);width:15px;height:15px;flex-shrink:0}
.ct{font-size:13px;font-weight:600;display:block}
.cd{font-size:11px;color:var(--muted-fg);margin-top:1px;display:block}

.swatch-row{display:flex;gap:8px;align-items:center}
.swatch-row input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--border);
  border-radius:8px;background:var(--background);cursor:pointer;flex-shrink:0}
.swatch-row input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--background);font-size:13px;font-family:var(--font-mono),monospace;text-transform:uppercase}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{border:1px solid var(--border);border-radius:10px;padding:9px;text-align:left;font-size:12px;font-weight:600}
.preset:hover{border-color:var(--primary)}
.dots{display:flex;gap:4px;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:99px;border:1px solid rgba(0,0,0,.12);display:inline-block}
.seg{display:flex;gap:3px;background:var(--muted);padding:3px;border-radius:9px;margin-bottom:12px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted-fg)}
.seg button[aria-selected=true]{background:var(--card);color:var(--foreground)}

.gate{position:fixed;inset:0;z-index:100;background:rgba(8,12,20,.72);display:grid;place-items:center;
  padding:16px;backdrop-filter:blur(3px)}
.gate-box{background:var(--card);border-radius:var(--radius);max-width:430px;width:100%;padding:24px;
  max-height:90dvh;overflow-y:auto}

.shop-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-size:19px;font-weight:800}
.brand span{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted-fg);
  font-weight:600;margin-left:8px}
.hero{background:var(--card);border-bottom:1px solid var(--border);padding:42px 0}
.hero .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--primary);font-weight:700}
.hero h1{font-size:clamp(27px,5vw,45px);line-height:1.08;margin-top:11px;max-width:17ch;font-weight:800}
.hero p{margin-top:13px;color:var(--muted-fg);max-width:44ch;line-height:1.6}
.layout{display:flex;gap:26px;align-items:flex-start;padding:22px 0 40px}
.col-main{flex:1;min-width:0}
.searchbar{position:relative;margin-bottom:11px}
.searchbar input{width:100%;padding:11px 14px 11px 36px;border:1px solid var(--border);
  border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:14px}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted-fg)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.count{font-size:12px;color:var(--muted-fg);margin-bottom:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .18s}
.pcard:hover{box-shadow:0 8px 24px rgba(0,0,0,.09)}
.pimg{aspect-ratio:1;position:relative;display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.initials{font-family:var(--font-display),sans-serif;font-size:34px;font-weight:800;color:rgba(0,0,0,.22)}
.pbadges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
.b{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.b-new{background:var(--accent);color:var(--primary)}
.b-sale{background:#b4231822;color:#b42318}
.b-out{background:var(--muted);color:var(--muted-fg)}
.pbody{padding:13px;display:flex;flex-direction:column;gap:9px;flex:1}
.pcat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);font-weight:600}
.pname{font-size:14px;font-weight:600;line-height:1.35;margin-top:3px}
.pdesc{font-size:12px;color:var(--muted-fg);line-height:1.5;margin-top:4px;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.pprice{font-family:var(--font-display),sans-serif;font-size:17px;font-weight:700}
.punit{font-size:11px;color:var(--muted-fg)}
.punit s{margin-right:4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);
  border-radius:calc(var(--radius) - 4px);height:36px;background:var(--background)}
.stepper button{width:32px;height:34px;display:grid;place-items:center;color:var(--muted-fg);font-size:16px}
.stepper button:hover:not(:disabled){background:var(--muted);color:var(--foreground)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper span{width:30px;text-align:center;font-size:13px;font-weight:700}
.lowstock{font-size:11px;font-weight:600;color:var(--warning)}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:44px 20px;text-align:center}

.rail{width:340px;flex-shrink:0;position:sticky;top:70px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;max-height:calc(100dvh - 92px);display:flex;flex-direction:column}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;
  border-bottom:1px solid var(--border);gap:8px}
.rail-head h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.rail-count{background:var(--muted);padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.rail-close{display:none}
.rail-body{flex:1;overflow-y:auto;padding:0 15px}
/* Checkout is a form, and a form inside its own scroll area hides fields and
   traps the wheel. The cap comes off so the rail is as tall as it needs to be
   and the page scrolls normally. */
.rail.checkout{max-height:none;position:static}
.rail.checkout .rail-body{overflow:visible}
/* Checkout is denser than the item list: the same content, less air, so the
   whole form and its summary sit on one screen on a laptop. */
.rail.checkout .field{margin-bottom:7px}
.rail.checkout .flabel{margin-bottom:3px}
.rail.checkout .field input,.rail.checkout .field select,
.rail.checkout .field textarea{padding:7px 10px}
.rail.checkout .trow{line-height:1.35}
.rail.checkout .rail-foot{gap:8px;padding:10px 15px 12px}
.rail.checkout .pay-opt{padding:6px 10px}
.rail.checkout .microcopy{margin:0;font-size:11px}
.rail.checkout .rail-body{padding-bottom:2px}
.rail-empty{text-align:center;padding:44px 12px;color:var(--muted-fg);font-size:13px;line-height:1.6}
.line{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:none}
.line-name{font-size:13px;font-weight:600}
.line-meta{font-size:11px;color:var(--muted-fg);margin-top:2px}
.line-total{font-size:13px;font-weight:700;margin-left:auto}
.rail-foot{border-top:1px dashed var(--border);padding:12px 15px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.trow dt{color:var(--muted-fg)}
.trow dd{font-weight:600}
.trow.total{border-top:1px dashed var(--border);padding-top:9px;margin-top:2px}
.trow.total dt{color:var(--foreground);font-weight:600}
.trow.total dd{font-family:var(--font-display),sans-serif;font-size:19px;font-weight:800}
.notice{padding:9px 11px;border-radius:calc(var(--radius) - 4px);font-size:12px;font-weight:600;line-height:1.45}
.notice-warn{background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning)}
.notice-ok{background:var(--accent);color:var(--primary)}
.notice-err{background:#b4231815;color:#b42318}
.notice-mute{background:var(--muted);color:var(--muted-fg)}
.microcopy{font-size:11px;color:var(--muted-fg);text-align:center;line-height:1.5}
.shop-nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shop-nav .navlink{font-size:13px;font-weight:500;color:var(--muted-fg);text-decoration:none}
.shop-nav .navlink:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.linkbtn{font-size:12px;color:var(--muted-fg);text-decoration:underline;text-underline-offset:2px}
/* Futurelite: choice of payment method at checkout. */
.pay-opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--border);
  border-radius:calc(var(--radius) - 4px);padding:7px 10px;cursor:pointer;background:var(--background)}
.pay-opt.on{border-color:var(--primary);background:var(--accent)}
.field input[type=radio],.field input[type=checkbox]{width:auto;flex:0 0 auto}
.pay-opt input[type=radio]{margin:2px 0 0;align-self:flex-start}
.pay-opt > span{flex:1 1 auto;min-width:0}
.railbar{display:none}

.narrow{max-width:640px;margin:32px auto;padding:0 16px}
.paybox{border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);
  background:color-mix(in srgb,var(--warning) 8%,transparent);border-radius:var(--radius);padding:20px}
.amt{font-family:var(--font-display),sans-serif;font-size:35px;font-weight:800;margin-top:3px}
.kv dt{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-fg);font-weight:700}
.kv dd{margin-bottom:12px;margin-top:3px}
.ordnum{font-family:var(--font-mono),monospace;font-size:19px;font-weight:700}
.trail{display:flex;gap:5px;margin:18px 0}
.trail>div{flex:1}
.trail .bar{height:6px;border-radius:99px;background:var(--muted)}
.trail .bar.on{background:var(--primary)}
.trail p{font-size:10.5px;line-height:1.3;margin-top:7px;color:var(--muted-fg)}
.trail p.on{color:var(--foreground);font-weight:600}

.adm-head{background:var(--card);border-bottom:1px solid var(--border);padding:11px 0 0}
.adm-nav{display:flex;gap:3px;padding-bottom:8px;overflow-x:auto}
.adm-nav button{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted-fg);white-space:nowrap}
.adm-nav button[aria-selected=true]{background:var(--muted);color:var(--foreground)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px}
.stat .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg);font-weight:700}
.stat .val{font-family:var(--font-display),sans-serif;font-size:25px;font-weight:800;margin-top:6px}
.stat .sub{font-size:11px;color:var(--muted-fg);margin-top:2px}
.stat.warn .val{color:var(--warning)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:15px;overflow:hidden}
.panel h3{padding:13px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel .pad{padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
.tscroll{overflow-x:auto}
thead{background:color-mix(in srgb,var(--muted) 60%,transparent)}
th{text-align:left;padding:9px 14px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted-fg);font-weight:700;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
tr[data-action]{cursor:pointer}
tr[data-action]:hover{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-amber{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.p-green{background:var(--accent);color:var(--primary)}
.p-blue{background:#2f6f9e22;color:#2f6f9e}
.p-slate{background:var(--muted);color:var(--muted-fg)}
.p-red{background:#b4231818;color:#b42318}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--primary);border-radius:4px 4px 0 0;opacity:.85}
.chartlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted-fg);margin-top:6px}
.dropzone{border:1px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center}
.dropzone.drag{border-color:var(--primary);background:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.thumb{border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);overflow:hidden}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.thumb .tf{display:flex;justify-content:space-between;align-items:center;padding:5px;gap:4px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:15px;align-items:start}
.toolbar{display:flex;gap:2px;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;padding:4px;margin-bottom:8px}
.toolbar button{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;
  color:var(--muted-fg);font-size:13px;font-weight:700}
.toolbar button:hover{background:var(--muted);color:var(--foreground)}
.prose{font-size:14px;line-height:1.7}
.prose h2{font-size:20px;margin:16px 0 8px}
.prose h3{font-size:16px;margin:14px 0 6px}
.prose p{margin-bottom:10px}
.prose ul,.prose ol{margin:0 0 10px 22px}
.prose li{margin-bottom:4px}
.prose a{color:var(--primary);text-decoration:underline}
.prose blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--muted-fg);margin-bottom:10px}
.callout{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--primary);
  border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--muted-fg);margin:14px 0}
.callout strong{color:var(--foreground)}
.footer{border-top:1px solid var(--border);padding:22px 0;margin-top:30px;font-size:12px;color:var(--muted-fg)}
.footer a{margin-right:14px;text-decoration:underline}
.toastwrap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:95;max-width:92vw}

@media (max-width:1000px){
  .layout{flex-direction:column;padding-bottom:80px}
  .cols{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 0 0 0;width:100%;max-height:86dvh;
    border-radius:var(--radius) var(--radius) 0 0;border-left:none;border-right:none;border-bottom:none;
    z-index:50;box-shadow:0 -8px 30px rgba(0,0,0,.16);transform:translateY(100%);transition:transform .25s ease}
  .rail.open{transform:translateY(0)}
  .rail-close{display:inline-flex}
  .railbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:49;align-items:center;
    justify-content:space-between;gap:12px;padding:13px 16px;background:var(--primary);
    color:var(--primary-fg);font-size:14px;font-weight:600;box-shadow:0 -4px 20px rgba(0,0,0,.18)}
  .railbar.hide{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
}
@media (max-width:430px){.drawer{width:100%}.grid2,.grid3{grid-template-columns:1fr}}
@media print{
  .chrome,.drawer,.scrim,.railbar,.noprint,.gate{display:none!important}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div id="gateHost"></div>
<div class="chrome noprint" id="chrome"></div>
<div class="scrim noprint" id="scrim" data-action="closeDrawer"></div>
<aside class="drawer noprint" id="drawer" aria-label="Branding editor"></aside>
<div id="app"></div>

<script>
'use strict';
/* ==========================================================================
   Demo of the ordering platform.
   Everything here is real behaviour running in the browser: stock is reserved
   then deducted, order numbers increment, and the shipping pricing is the same
   algorithm the database runs.

// --- Futurelite: Solana address handling ---------------------------------
// Ported from src/lib/solana.ts so the demo validates exactly as the app does.
// No key material is involved anywhere: these are public addresses only.
const A58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const M58 = new Map([...A58].map((c,i)=>[c,i]));
function decodeBase58(str){
  if (!str.length) return null;
  const bytes = [0];
  for (const ch of str){
    const v = M58.get(ch); if (v === undefined) return null;
    let carry = v;
    for (let i=0;i<bytes.length;i++){ carry += bytes[i]*58; bytes[i] = carry & 0xff; carry >>= 8; }
    while (carry > 0){ bytes.push(carry & 0xff); carry >>= 8; }
  }
  for (const ch of str){ if (ch !== '1') break; bytes.push(0); }
  return new Uint8Array(bytes.reverse());
}
// A Solana address carries no checksum — unlike Ethereum's EIP-55 or Bitcoin's
// hash suffix. Length and alphabet alone let a dropped character through, so
// the bytes are also checked against the ed25519 curve. That rejects about half
// of single-character slips; it cannot catch every one.
const ED_P = (1n<<255n) - 19n;
const ED_D = 37095705934669439343138083508754565189542113879843219016388785533085940283555n;
function modPow(b,e,m){ let r=1n; b%=m; while(e>0n){ if(e&1n) r=r*b%m; b=b*b%m; e>>=1n; } return r; }
function isOnCurve(bytes){
  if (bytes.length !== 32) return false;
  let y = 0n; for (let i=31;i>=0;i--) y = (y<<8n) | BigInt(bytes[i]);
  const sign = (y>>255n) & 1n; y &= (1n<<255n)-1n;
  if (y >= ED_P) return false;
  const y2 = y*y % ED_P, num = (y2-1n+ED_P) % ED_P, den = (ED_D*y2+1n) % ED_P;
  if (den === 0n) return false;
  const x2 = num*modPow(den, ED_P-2n, ED_P) % ED_P;
  if (x2 === 0n) return sign === 0n;
  let x = modPow(x2, (ED_P+3n)/8n, ED_P);
  if ((x*x - x2) % ED_P !== 0n) x = x*modPow(2n,(ED_P-1n)/4n,ED_P) % ED_P;
  return (x*x - x2) % ED_P === 0n;
}
function addressProblem(a){
  const t = String(a).trim();
  if (!t) return 'Empty line.';
  const bad = [...new Set([...t].filter(c => !M58.has(c)))];
  if (bad.length) return 'Contains characters that never appear in a Solana address: ' + bad.join(' ');
  if (t.length < 32) return 'Too short to be a Solana address.';
  if (t.length > 44) return 'Too long to be a Solana address.';
  const d = decodeBase58(t);
  if (!d) return 'Not valid base58.';
  if (d.length !== 32) return `Decodes to ${d.length} bytes; a Solana address is 32.`;
  if (!isOnCurve(d)) return 'Not a valid Solana wallet address — check for a missed or swapped character.';
  return null;
}

// --- Marketing consent ----------------------------------------------------
// Mirrors marketing_consent_basis() in the database. Two bases, and buying
// something is one of them:
//   express — ticked the box. Does not expire.
//   implied — bought something. Lasts IMPLIED_CONSENT_MONTHS from that order,
//             and every new order restarts the clock.
// An unsubscribe outranks both and cannot be undone from this screen.
const IMPLIED_CONSENT_MONTHS = 24;
const MONTH_MS = 30.44 * 24 * 3600 * 1000;
function consentBasis(c){
  if (c.unsubscribed) return 'unsubscribed';
  if (c.optIn) return 'express';
  if (c.impliedAt && c.impliedAt > Date.now() - IMPLIED_CONSENT_MONTHS*MONTH_MS) return 'implied';
  if (c.impliedAt) return 'expired';
  return 'none';
}
const canEmail = c => ['express','implied'].includes(consentBasis(c));
function consentExpires(c){
  if (c.optIn || !c.impliedAt) return null;
  return c.impliedAt + IMPLIED_CONSENT_MONTHS*MONTH_MS;
}

// CAD cents -> USDC micros, rounded to two decimals so the figure is one a
// person can type. Mirrors usdc_quote() in the database.
function usdcMicros(cents, rate, markupBps){
  const raw = cents * 10000 * (1 + (markupBps||0)/10000) / rate;
  return Math.round(raw/10000) * 10000;
}
const fmtUsdc = m => (m/1e6).toLocaleString('en-CA',{minimumFractionDigits:2, maximumFractionDigits:2});
// Every precondition for offering USDC: switched on, a rate fresh enough to
// trust, and an unused address left to hand out.
// Mirrors crypto_discount_for() in the database. Charged against the subtotal
// so the advertised percentage is the one the customer sees, capped so the two
// discounts together can never exceed the goods value.
// Prices a basket. Every total and every advertised saving in this file goes
// through here, so the figure on the button and the figure on the receipt
// cannot be computed two different ways and quietly disagree.
function priceBasket(sub, disc, fee){
  const tax = Math.round(((sub - disc) + fee) * S.settings.taxBps / 10000);
  return {tax, total:(sub - disc) + fee + tax};
}

// What choosing USDC is worth: the order priced both ways, subtracted.
function cryptoSaving(sub, couponDisc, fee){
  const c = cryptoDiscount(sub, couponDisc);
  if (c <= 0) return 0;
  return priceBasket(sub, couponDisc, fee).total
       - priceBasket(sub, couponDisc + c, fee).total;
}

function cryptoDiscount(subtotal, couponDiscount){
  const u = S.usdc;
  if (!u.discountOn || u.discountBps <= 0) return 0;
  // Not stacking means the coupon wins outright — the customer keeps the better
  // deal they already had rather than losing it by choosing USDC.
  if (couponDiscount > 0 && !u.discountStacks) return 0;
  let amt = Math.round(subtotal * u.discountBps / 10000);
  if (u.discountMaxCents > 0) amt = Math.min(amt, u.discountMaxCents);
  return Math.max(0, Math.min(amt, subtotal - couponDiscount));
}

function usdcAvailable(){
  const u = S.usdc;
  if (!u || !u.enabled) return false;
  if (!u.rate || !u.fetchedAt) return false;
  if ((Date.now() - u.fetchedAt) > u.maxAgeHours*3600000) return false;
  return u.pool.some(w => !w.orderNum && !w.retired);
}

  $('#fontLink').href = 'https://fonts.googleapis.com/css2?' + fams.join('&') + '&display=swap';
}

/* ---------- markdown: escape first, then format, so typed HTML can never become a tag ---------- */
function md(src){
  const lines = esc(src).split('\n');
  let out = '', list = null, para = [];
  const inline = t => t
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const flushP = () => { if (para.length){ out += '<p>'+inline(para.join(' '))+'</p>'; para = []; } };
  const flushL = () => { if (list){ out += '</'+list+'>'; list = null; } };
  for (const raw of lines){
    const line = raw.trim();
    if (!line){ flushP(); flushL(); continue; }
    let m;
    if ((m = line.match(/^(#{2,3})\s+(.*)$/))){ flushP(); flushL();
      out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if ((m = line.match(/^>\s?(.*)$/))){ flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = line.match(/^[-*]\s+(.*)$/))){ flushP();
      if (list !== 'ul'){ flushL(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\d+\.\s+(.*)$/))){ flushP();
      if (list !== 'ol'){ flushL(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL();
  return out;
}

/* ---------- delivery pricing: same algorithm as the database ---------- */
function bestFee(sub, items){
  let fee = S.delivery.feeCents, label = null;
  for (const r of S.rules){
    if (!r.active) continue;
    const hit = r.cond === 'always' || (r.cond === 'items' ? items >= r.threshold : sub >= r.threshold);
    if (!hit) continue;
    let cand = r.effect === 'free' ? 0
      : r.effect === 'set' ? r.amount
      : r.effect === 'off' ? S.delivery.feeCents - r.amount
      : Math.round(S.delivery.feeCents * (1 - r.amount/10000));
    cand = Math.max(0, cand);
    // Several rules can match. The customer gets the cheapest, never the first.
    if (cand < fee){ fee = cand; label = r.label; }
  }
  return {fee, label};
}
function quote(sub, items){
  const d = S.delivery;
  const pc = S.checkout.postal.replace(/[^a-z0-9]/gi,'').toUpperCase();
  if (pc.length < 3) return {ready:false};
  if (d.restrict && !d.areas.some(a => pc.startsWith(a)))
    return {ready:true, ok:false, msg:"We don't ship to that postal code yet."};
  if (sub < d.minCents) return {ready:true, ok:false, msg:`Orders start at ${money(d.minCents)}.`};
  const b = bestFee(sub, items);
  return {ready:true, ok:true, fee:b.fee, label:b.label};
}
const normCode = c => String(c||'').replace(/[^a-z0-9]/gi,'').toUpperCase();

/* Mirrors evaluate_coupon() in the database, including the order the guards run
   in and the deliberately vague message for unknown vs paused codes. */
function evalCoupon(code, sub, fee, email){
  const c = normCode(code);
  if (!c) return {valid:false, msg:'Enter a code.'};
  const cp = S.coupons.find(x => x.code === c);
  if (!cp || !cp.active) return {valid:false, msg:"That code isn't valid."};
  if (cp.expires && Date.now() >= cp.expires) return {valid:false, msg:'That code has expired.'};
  if (cp.uses !== null && cp.redeemed >= cp.uses)
    return {valid:false, msg:'That code has been fully redeemed.'};
  if (cp.perCustomer !== null && email){
    const used = S.redemptions.filter(r => r.couponId === cp.id
      && r.email.toLowerCase() === email.trim().toLowerCase()).length;
    if (used >= cp.perCustomer) return {valid:false, msg:'You have already used that code.'};
  }
  if (sub < cp.min) return {valid:false, msg:`That code needs an order of at least ${money(cp.min)}.`};

  let discount, label, appliesTo;
  if (cp.kind === 'percent'){
    discount = Math.round(sub * cp.value / 10000);
    if (cp.cap !== null) discount = Math.min(discount, cp.cap);
    label = String(cp.value/100).replace(/\.0+$/,'') + '% off';
    appliesTo = 'subtotal';
  } else if (cp.kind === 'amount'){
    discount = cp.value; label = money(cp.value) + ' off'; appliesTo = 'subtotal';
  } else {
    discount = fee; label = 'Free shipping'; appliesTo = 'delivery';
  }
  // A discount can bring a bill to zero but never below it.
  discount = Math.max(0, Math.min(discount, appliesTo === 'delivery' ? fee : sub));
  return {valid:true, id:cp.id, code:cp.code, label, discount, appliesTo, msg:label + ' applied.'};
}
function describeCoupon(cp){
  const effect = cp.kind === 'ship' ? 'Waives the shipping charge'
    : cp.kind === 'percent'
      ? `Takes ${String(cp.value/100).replace(/\.0+$/,'')}% off the items`
        + (cp.cap !== null ? `, up to ${money(cp.cap)}` : '')
      : `Takes ${money(cp.value)} off the items`;
  return cp.min > 0 ? `${effect}, on orders of ${money(cp.min)} or more.` : `${effect}.`;
}
function couponState(cp){
  if (!cp.active) return ['Paused','p-slate'];
  if (cp.expires && Date.now() >= cp.expires) return ['Expired','p-slate'];
  if (cp.uses !== null && cp.redeemed >= cp.uses) return ['Fully redeemed','p-red'];
  return ['Live','p-green'];
}

const avail = p => Math.max(0, p.qty - p.reserved);
function cartLines(){
  return Object.keys(S.cart).map(id => { const p = S.products.find(x => x.id === id);
    return p ? {...p, n:S.cart[id]} : null; }).filter(Boolean);
}
function totals(){
  const lines = cartLines();
  const items = lines.reduce((s,l) => s+l.n, 0);
  const sub = lines.reduce((s,l) => s+l.price*l.n, 0);
  const q = quote(sub, items);
  const baseFee = q.ready && q.ok ? q.fee : 0;

  // Re-check the applied coupon against the current basket: a percentage is
  // worth a different amount, and removing items can drop it under a minimum.
  let cSub = 0, cShip = 0, coupon = null;
  if (S.coupon){
    const r = evalCoupon(S.coupon.code, sub, baseFee, S.checkout.email);
    if (r.valid){
      coupon = r;
      if (r.appliesTo === 'delivery') cShip = r.discount; else cSub = r.discount;
    } else {
      coupon = {invalid:true, code:S.coupon.code, msg:r.msg};
    }
  }
  const fee = baseFee - cShip;
  // The USDC discount joins the coupon in the goods discount, not off the end.
  // Tax is charged on (goods - discounts) + delivery, so taking it off the
  // final figure would tax the customer on money they never paid.
  const crypto = S.checkout.payMethod === 'usdc' ? cryptoDiscount(sub, cSub) : 0;
  const disc = cSub + crypto;
  const priced = priceBasket(sub, disc, fee);
  const tax = q.ready && q.ok ? priced.tax : 0;
  return {lines, items, sub, q, baseFee, fee, tax, coupon, cSub, cShip, crypto, disc,
    total:(sub - disc) + fee + tax};
}

let toastTimer;
function toast(msg, tone='ok'){
  S.toast = {msg, tone}; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 3400);
}

/* ---------- order lifecycle ---------- */
const STATUSES = ['pending_payment','preparing','out_for_delivery','delivered'];
const STATUS_META = {
  pending_payment:{l:'Pending payment', c:'Waiting for your payment', p:'p-amber'},
  preparing:{l:'Preparing', c:'Packing your order', p:'p-blue'},
  out_for_delivery:{l:'Out for delivery', c:'On the way to you', p:'p-blue'},
  delivered:{l:'Delivered', c:'Delivered', p:'p-green'},
  cancelled:{l:'Cancelled', c:'Cancelled', p:'p-slate'},
  refunded:{l:'Refunded', c:'Refunded', p:'p-red'},
};

function placeOrder(){
  const t = totals(), c = S.checkout, e = {};

  // The live app counts these in the database, per address and per email. Here
  // it is a simple counter, purely so the message can be seen.
  S.recentOrders = (S.recentOrders || []).filter(ts => Date.now() - ts < 600000);
  if (S.recentOrders.length >= 5){
    toast('That is a lot of orders in a short time. Wait a few minutes and try again, or call us.','err');
    return;
  }
  if (c.name.trim().length < 2) e.name = 'Enter your full name';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email.trim())) e.email = 'Enter a valid email';
  if (c.phone.replace(/\D/g,'').length < 10) e.phone = 'Enter a phone number we can reach you on';
  if (c.addr.trim().length < 4) e.addr = 'Enter your street address';
  if (c.city.trim().length < 2) e.city = 'Enter your city';
  if (!c.province) e.province = 'Choose your province';
  if (!/^[a-z]\d[a-z]\s?\d[a-z]\d$/i.test(c.postal.trim())) e.postal = 'That does not look like a Canadian postal code';
  S.cerr = e;
  if (Object.keys(e).length){ render(); return; }
  if (!t.q.ready || !t.q.ok || t.items === 0){ render(); return; }
  if (t.coupon && t.coupon.invalid){
    S.couponErr = t.coupon.msg; S.coupon = null; S.couponOpen = true;
    toast(t.coupon.msg, 'err'); return;
  }

  for (const l of t.lines){
    const p = S.products.find(x => x.id === l.id);
    if (avail(p) < l.n){ toast(`${p.name} only has ${avail(p)} left.`, 'err'); return; }
  }
  // Reserve. Stock stays held until payment is confirmed.
  t.lines.forEach(l => { S.products.find(x => x.id === l.id).reserved += l.n; });

  // Futurelite: take an address before the order exists, so a drained pool
  // fails cleanly instead of leaving an unpayable order behind.
  const usingUsdc = S.checkout.payMethod === 'usdc';
  let slot = null;
  if (usingUsdc){
    if (!usdcAvailable()){
      toast('USDC is not available right now. Choose Interac e-Transfer instead.','err');
      t.lines.forEach(l => { S.products.find(x => x.id === l.id).reserved -= l.n; });
      S.checkout.payMethod = 'interac'; render(); return;
    }
    slot = S.usdc.pool.filter(w => !w.orderNum && !w.retired).sort((a,b)=>a.pos-b.pos)[0];
  }

  S.settings.seq += 1;
  const num = `${S.settings.prefix}-${S.settings.year}-${String(S.settings.seq).padStart(6,'0')}`;
  if (slot) slot.orderNum = num;   // one address, one order, forever
  S.orders.unshift({
    id:uid(), num, at:Date.now(), status:'pending_payment', paid:0,
    name:c.name, email:c.email.toLowerCase(), phone:c.phone,
    addr:c.addr, city:c.city, province:c.province, postal:c.postal.toUpperCase(), notes:c.notes,
    items:t.lines.map(l => ({sku:l.sku, name:l.name, unit:l.unit, price:l.price, n:l.n, pid:l.id})),
    sub:t.sub, fee:t.fee, tax:t.tax, total:t.total, discount:t.q.label,
    couponCode:t.coupon && !t.coupon.invalid ? t.coupon.code : '',
    couponLabel:t.coupon && !t.coupon.invalid ? t.coupon.label : '',
    couponOff:t.cSub, couponShip:t.cShip,
    reserved:true, deducted:false, note:'',
    payMethod: usingUsdc ? 'usdc' : 'interac',
    cryptoDisc: t.crypto,
    cryptoBps: t.crypto > 0 ? S.usdc.discountBps : 0,
    cryptoLabel: t.crypto > 0 ? S.usdc.discountLabel : '',
    usdcAddr: slot ? slot.addr : '',
    // The rate is stamped on the order, not looked up later, so a disputed
    // amount can always be reconstructed.
    usdcMicros: usingUsdc ? usdcMicros(t.total, S.usdc.rate, S.usdc.markupBps) : 0,
    usdcRate: usingUsdc ? S.usdc.rate : 0,
    usdcSource: usingUsdc ? S.usdc.source : '',
    usdcExpires: usingUsdc ? Date.now() + S.usdc.quoteMins*60000 : 0,
    usdcGot: 0,
    history:[{s:'pending_payment', at:Date.now(),
      note: usingUsdc ? 'Order placed. Awaiting USDC on Solana.' : 'Order placed. Awaiting Interac e-Transfer.'}],
  });
  // Redeem last, so a failed order never burns a use.
  if (t.coupon && !t.coupon.invalid){
    const cp = S.coupons.find(x => x.id === t.coupon.id);
    if (cp){
      cp.redeemed += 1;
      S.redemptions.push({couponId:cp.id, orderNum:num, email:c.email.toLowerCase(),
        given:t.cSub + t.cShip, at:Date.now()});
    }
  }
  S.coupon = null; S.couponOpen = false; S.couponInput = ''; S.couponErr = null;

  // One row per email address, however many times they order. The purchase
  // itself is a basis to email them; the box only controls whether that
  // survives after they stop ordering.
  const key = c.email.trim().toLowerCase();
  const optedIn = (S.gate.acks || []).some((ak, i) =>
    !ak.required && /email me|specials|marketing/i.test(ak.label) && (S.gateTicked||{})[i]);
  const existing = S.contacts.find(x => x.email === key);
  if (existing){
    existing.name = c.name || existing.name;
    existing.orders += 1;
    existing.spent += t.total;
    existing.last = Date.now();
    // Consent only ever moves up from an order; unsubscribing is the way out,
    // and it is never undone by ordering again.
    if (optedIn && !existing.unsubscribed) existing.optIn = true;
    if (!existing.unsubscribed) existing.impliedAt = Date.now();
  } else {
    S.contacts.unshift({email:key, name:c.name, phone:c.phone, orders:1, spent:t.total,
      first:Date.now(), last:Date.now(), optIn:optedIn, unsubscribed:false,
      impliedAt:Date.now()});
  }

  S.recentOrders = [...(S.recentOrders||[]), Date.now()];
  S.lastOrder = S.orders[0].id;
  S.cart = {}; S.railMode = 'items'; S.openRail = false; S.view = 'confirm';
  save(); render(); window.scrollTo(0,0);
}

function recordPayment(orderId, cents){
  const o = S.orders.find(x => x.id === orderId); if (!o) return;
  o.paid += cents;
  if (o.paid < o.total){
    o.history.push({s:o.status, at:Date.now(), note:`Partial payment of ${money(cents)} recorded.`});
    toast(`Partial payment recorded. ${money(o.total-o.paid)} still owing.`, 'warn');
  } else {
    if (!o.deducted){
      o.items.forEach(i => { const p = S.products.find(x => x.id === i.pid); if (!p) return;
        if (o.reserved) p.reserved = Math.max(0, p.reserved - i.n);
        p.qty = Math.max(0, p.qty - i.n); });
      o.reserved = false; o.deducted = true;
    }
    if (o.status === 'pending_payment'){
      o.status = 'preparing';
      o.history.push({s:'preparing', at:Date.now(), note:'Interac e-Transfer confirmed.'});
    }
    toast('Payment confirmed. Stock deducted and the order is now preparing.');
  }
  save(); render();
}

function setStatus(orderId, status, note){
  const o = S.orders.find(x => x.id === orderId);
  if (!o || o.status === status) return;
  if (status === 'cancelled' || status === 'refunded'){
    o.items.forEach(i => { const p = S.products.find(x => x.id === i.pid); if (!p) return;
      if (o.reserved) p.reserved = Math.max(0, p.reserved - i.n);
      else if (o.deducted) p.qty += i.n; });
    o.reserved = false; o.deducted = false;
  }
  o.status = status;
  o.history.push({s:status, at:Date.now(), note:note || ''});
  toast('Status updated. In the real app this also emails the customer.');
  save(); render();
}

function gridHTML(){
  const q = S.filters.q.trim().toLowerCase();
  const list = S.products.filter(p => p.status === 'active'
    && (S.filters.cat === 'Everything' || p.cat === S.filters.cat)
    && (!q || (p.name+' '+p.desc+' '+p.sku).toLowerCase().includes(q)))
    .sort((a,b) => (b.featured?1:0)-(a.featured?1:0));

  if (!list.length) return `<div class="empty">
    <p style="font-weight:700;font-family:var(--font-display),sans-serif">${C('shop.emptyTitle')}</p>
    <p class="hint" style="margin:6px auto 12px;max-width:36ch">${C('shop.emptyBody')}</p>
    <button class="btn btn-outline btn-sm" data-action="clearFilters">Clear filters</button></div>`;

  return `<p class="count">${list.length} ${list.length===1?'product':'products'}</p>
  <div class="grid">${list.map(p => {
    const n = S.cart[p.id] || 0, st = avail(p), out = st === 0;
    return `<article class="pcard">
      <div class="pimg" style="background:linear-gradient(140deg,hsl(${p.hue} 42% 90%),hsl(${p.hue} 32% 78%))">
        ${p.img ? `<img src="${p.img}" alt="${esc(p.name)}">` : `<span class="initials">${esc(p.name.slice(0,2).toUpperCase())}</span>`}
        <div class="pbadges">${p.isNew?'<span class="b b-new">New</span>':''}${p.was>p.price?'<span class="b b-sale">Sale</span>':''}${out?'<span class="b b-out">Sold out</span>':''}</div>
      </div>
      <div class="pbody">
        <div style="flex:1"><div class="pcat">${esc(p.cat)}</div>
          <div class="pname">${esc(p.name)}</div>
          <div class="pdesc">${esc(p.desc)}</div></div>
        <div class="prow">
          <div><div class="pprice tabular">${money(p.price)}</div>
            <div class="punit">${p.was>p.price?`<s class="tabular">${money(p.was)}</s>`:''}per ${esc(p.unit)}</div></div>
          ${out ? '' : n === 0
            ? `<button class="btn" style="height:36px" data-action="add" data-id="${p.id}">+ Add</button>`
            : `<div class="stepper"><button data-action="dec" data-id="${p.id}" aria-label="Remove one">−</button>
               <span class="tabular">${n}</span>
               <button data-action="inc" data-id="${p.id}" ${n>=st?'disabled':''} aria-label="Add one">+</button></div>`}
        </div>
        ${!out && st<=10 ? `<div class="lowstock tabular">Only ${st} left</div>` : ''}
      </div></article>`;
  }).join('')}</div>`;
}

           ${t.q.ready&&t.q.ok
             ? (S.checkout.payMethod==='usdc'
                 ? 'Place order · '+fmtUsdc(usdcMicros(t.total,S.usdc.rate,S.usdc.markupBps))+' USDC'
                 : 'Place order · '+money(t.total))
             : 'Enter a delivery address'}</button>
         <button class="linkbtn" data-action="toItems">Back to items</button>
         <p class="microcopy">${C('order.microcopy')}</p>`}

function payMethodHTML(t){
  // USDC only appears when it can actually be taken. If the pool is empty or
  // the rate has gone stale, the option is not shown at all rather than shown
  // and then failing at the last step, which would lose the order.
  if (!usdcAvailable()) return '';
  const micros = usdcMicros(t.q.ready&&t.q.ok ? t.total : t.sub, S.usdc.rate, S.usdc.markupBps);
  // What choosing USDC is worth. Computed by pricing the order both ways and
  // subtracting, rather than as "the discount plus some tax" — the customer's
  // saving is whatever their total moves by, and pricing it twice is the only
  // way to be sure the number on the button is the number on the receipt.
  const saving = (t.q.ready && t.q.ok) ? cryptoSaving(t.sub, t.cSub, t.fee) : 0;
  const opt = (id,label,hint,extra,badge) => `
    <label class="pay-opt ${S.checkout.payMethod===id?'on':''}">
      <input type="radio" name="paymethod" value="${id}" ${S.checkout.payMethod===id?'checked':''}
        data-paymethod="${id}">
      <span style="min-width:0">
        <span style="display:block;font-size:13px;font-weight:600">${label}
          ${badge?`<span class="pill p-green" style="margin-left:4px">${badge}</span>`:''}</span>
        <span class="hint" style="display:block;font-size:12px">${hint}</span>
        ${extra?`<span class="tabular" style="display:block;font-size:12px;font-weight:600;margin-top:2px">${extra}</span>`:''}
      </span></label>`;
  return `<div class="field" style="margin:2px 0 0">
    <span class="flabel">How would you like to pay?</span>
    <div style="display:flex;flex-direction:column;gap:7px;margin-top:5px">
      ${opt('interac','Interac e-Transfer','Pay from your Canadian bank account','')}
      ${opt('usdc','USDC on Solana','Pay with any Solana wallet',
        t.q.ready&&t.q.ok?`${fmtUsdc(micros)} USDC`:'',
        saving>0?`Save ${money(saving)}`:'')}
    </div></div>`;
}

function payboxHTML(o){

  const ins = `Send an Interac e-Transfer of ${money(o.total)} to ${S.settings.payEmail}.\nPut your order number ${o.num} in the message field.`;
  return `<div class="paybox">
    <h2 style="font-size:18px">${C('confirm.title')}</h2>
    <p class="hint" style="margin-top:4px">${C('confirm.body')}</p>
    <dl class="kv" style="margin-top:14px">
      <dt>Amount</dt><dd class="amt tabular">${money(o.total)}</dd>
      <dt>Send to</dt><dd class="mono" style="font-size:14px;word-break:break-all">${esc(S.settings.payEmail)}</dd>
      <dt>Message field — this is how we find your order</dt><dd class="ordnum">${o.num}</dd></dl>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-outline btn-sm" data-action="copy" data-text="${esc(o.num)}">Copy order number</button>
      <button class="btn btn-outline btn-sm" data-action="copy" data-text="${esc(S.settings.payEmail)}">Copy payment email</button>
      <button class="btn btn-outline btn-sm" data-action="copy" data-text="${esc(ins)}">Copy instructions</button>
      <button class="btn btn-outline btn-sm" data-action="print">Print receipt</button>
    </div></div>`;
}
function usdcBoxHTML(o){
  // The address never changes on a re-quote — only the amount — so a payment
  // already in flight still lands somewhere attributable to this order.
  const expired = Date.now() > o.usdcExpires;
  const mins = Math.max(0, Math.round((o.usdcExpires - Date.now())/60000));
  const ins = `Send exactly ${fmtUsdc(o.usdcMicros)} USDC on the Solana network.\nTo this address: ${o.usdcAddr}\nThis address belongs to order ${o.num} and no other order.`;
  return `<div class="paybox">
    <h2 style="font-size:18px">Send your USDC</h2>
    <p class="hint" style="margin-top:4px">We hold your items while we wait. Nothing ships until the payment lands.</p>
    <dl class="kv" style="margin-top:14px">
      <dt>Send exactly</dt><dd class="amt tabular">${fmtUsdc(o.usdcMicros)} USDC</dd>
      <dt>To this address — it belongs to your order alone</dt>
      <dd class="mono" style="font-size:13px;word-break:break-all">${esc(o.usdcAddr)}</dd></dl>
    <p class="hint" style="margin-top:8px">Your order total is ${money(o.total)} — converted at
      1 USDC = ${o.usdcRate.toFixed(4)} CAD.</p>
    ${expired
      ? `<div class="notice notice-warn" style="margin-top:12px">
           This amount was worked out a while ago and the rate may have moved.
           <button class="btn btn-sm" style="margin-top:8px" data-action="requote" data-id="${o.id}">Refresh amount</button></div>`
      : `<p class="hint" style="margin-top:10px">This amount holds for about ${mins} more ${mins===1?'minute':'minutes'}.</p>`}
    <div class="notice notice-mute" style="margin-top:12px">
      <strong>Before you send</strong>
      <ul style="margin:6px 0 0;padding-left:18px">
        <li>Send <strong>USDC on the Solana network</strong>. USDC on another network, or a different coin, cannot be recovered.</li>
        <li>Send the exact amount shown above.</li>
        <li>We confirm payments by hand, usually within a few hours.</li></ul></div>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-outline btn-sm" data-action="copy" data-text="${esc(o.usdcAddr)}">Copy address</button>
      <button class="btn btn-outline btn-sm" data-action="copy" data-text="${fmtUsdc(o.usdcMicros)}">Copy amount</button>
      <button class="btn btn-outline btn-sm" data-action="copy" data-text="${esc(ins)}">Copy instructions</button>
      <button class="btn btn-outline btn-sm" data-action="expireQuote" data-id="${o.id}">Simulate 15 minutes passing</button>
      <button class="btn btn-outline btn-sm" data-action="print">Print receipt</button>
    </div></div>`;
}

/* ==========================================================================

   ========================================================================== */
const ROLES = {read_only:1, employee:2, manager:3, administrator:4};
const can = lvl => S.role && ROLES[S.role] >= ROLES[lvl];

function viewAdmin(){
  if (!S.role) return adminLogin();
  const panes = [['dash','Dashboard','read_only'],['orders','Orders','read_only'],['inv','Inventory','read_only'],
    ['delivery','Shipping','manager'],['customers','Customers','read_only'],['reports','Reports','read_only'],['coupons','Coupons','manager'],
    ['payments','Payments','manager'],
    ['content','Content','administrator'],['emails','Emails','administrator'],
    ['branding','Branding','administrator'],
    ['settings','Settings','administrator']];
  const visible = panes.filter(p => can(p[2]));
  // Sub-screens reached from inside a pane rather than from the nav. Leaving one
  // out of this list silently bounces the person back to the dashboard, and
  // each still needs its own role check — the real app gates these routes
  // server-side, so hiding the button is not the whole story.
  const SUBPANES = {order:'read_only', product:'manager', import:'manager', page:'administrator'};
  const subRole = SUBPANES[S.pane];
  if (subRole !== undefined){
    if (!can(subRole)) S.pane = 'dash';
  } else if (!visible.some(p => p[0] === S.pane)){
    S.pane = 'dash';
  }
  const fn = {dash:paneDash, orders:paneOrders, order:paneOrder, inv:paneInv, product:paneProduct,
    delivery:paneDelivery, customers:paneCustomers, reports:paneReports, import:paneImport, coupons:paneCoupons, payments:panePayments, content:paneContent, page:panePage, emails:paneEmails, branding:paneBranding, settings:paneSettings}[S.pane] || paneDash;
  return `<div class="adm-head"><div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap">
        <div style="font-size:15px;font-weight:700">Back office</div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="hint">Signed in as <strong style="color:var(--foreground);text-transform:capitalize">${S.role.replace('_',' ')}</strong></span>
          <button class="btn btn-outline btn-sm" data-action="signout">Switch role</button></div></div>
      <nav class="adm-nav">${visible.map(p =>
        `<button aria-selected="${S.pane===p[0]}" data-action="pane" data-p="${p[0]}">${p[1]}</button>`).join('')}</nav>
    </div></div>
    <div class="wrap" style="padding-bottom:50px">${fn()}</div>`;
}

function adminLogin(){
  const blurb = {read_only:'View only', employee:'Payments, status, stock',
    manager:'+ products & delivery', administrator:'Everything'};
  return `<div class="narrow" style="max-width:440px">
    <h1 style="font-size:24px">Back office</h1>
    <p class="hint" style="margin:6px 0 18px">Staff accounts only — customers never sign in.

    ${Object.keys(ROLES).map(r => `<button class="btn btn-outline btn-lg"
      style="margin-bottom:8px;justify-content:space-between" data-action="signin" data-r="${r}">
      <span style="text-transform:capitalize">${r.replace('_',' ')}</span>
      <span class="hint">${blurb[r]}</span></button>`).join('')}</div>`;
}

function paneDash(){

      <div class="sub">Preparing or on the road</div></div>
    <div class="stat"><div class="lbl">Inventory value</div><div class="val tabular">${money(invVal)}</div>
      <div class="sub">At cost</div></div></div>
  <div class="panel"><h3>Revenue, last 14 days</h3><div class="pad">
    <div class="bars">${[42,58,35,71,64,88,52,79,61,95,73,68,84,91].map(h=>`<div style="height:${h}%"></div>`).join('')}</div>
    <div class="chartlabels"><span>14 days ago</span><span>7 days ago</span><span>Today</span></div>
    <p class="hint" style="margin-top:8px">This chart is illustrative. The tiles above are your live demo orders.</p></div></div>
  <div class="panel"><h3>Needs attention</h3><div class="pad">
    ${!out.length && !low.length ? '<p class="hint">Nothing is low or out of stock.</p>' : ''}
    ${out.map(p=>`<div style="margin-bottom:8px;font-size:13px"><span class="pill p-red">out of stock</span>
      <span class="hint">${esc(p.name)} is out of stock.</span></div>`).join('')}
    ${low.map(p=>`<div style="margin-bottom:8px;font-size:13px"><span class="pill p-amber">low stock</span>

  ${S.orders.length ? `<div class="panel"><h3>Recent orders</h3><div class="tscroll"><table>
    <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th style="text-align:right">Total</th></tr></thead>
    <tbody>${S.orders.slice(0,6).map(o=>`<tr data-action="openOrder" data-id="${o.id}">

  </table></div></div>` : `<div class="panel"><div class="pad hint">
    No orders yet. Switch to the storefront, place one, then come back and confirm the payment.</div></div>`}`;
}

function describeRule(r){
  const when = r.cond==='always' ? 'On every order'
    : r.cond==='items' ? `When someone buys ${r.threshold} or more items`
    : `When the subtotal reaches ${money(r.threshold)}`;
  const then = r.effect==='free' ? 'shipping is free'
    : r.effect==='set' ? `shipping costs ${money(r.amount)}`
    : r.effect==='off' ? `take ${money(r.amount)} off shipping`
    : `take ${(r.amount/100).toFixed(0)}% off shipping`;
  return `${when}, ${then}.`;
}

/* Mirrors lib/csv.ts: quoted fields, escaped quotes, embedded newlines, BOM. */
function parseCsvDemo(input){
  const text = input.replace(/^\uFEFF/, '');
  const records = []; let field = '', record = [], inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
      continue;
    }
    if (c === '"') inQ = true;
    else if (c === ',') { record.push(field); field = ''; }
    else if (c === '\r') {}
    else if (c === '\n'){ record.push(field); records.push(record); record = []; field = ''; }
    else field += c;
  }
  if (field !== '' || record.length) { record.push(field); records.push(record); }
  const rows = records.filter(r => r.some(c => c.trim() !== ''));
  if (!rows.length) return {headers:[], rows:[]};
  const headers = rows[0].map(h => h.trim());
  return {headers, rows: rows.slice(1).map(cells => {
    const o = {}; headers.forEach((h,i) => o[h] = (cells[i]||'').trim()); return o; })};
}
function moneyCents(raw){
  const t = String(raw||'').trim(); if (!t) return null;
  let c = t.replace(/[()]/g,'').replace(/[^0-9.,-]/g,''); if (!c || c==='-') return null;
  if (c.lastIndexOf(',') > c.lastIndexOf('.')) c = c.replace(/\./g,'').replace(',','.');
  else c = c.replace(/,/g,'');
  const v = Number(c.replace(/-/g,'')); return isFinite(v) ? Math.round(v*100) : null;
}
const IMPORT_ALIASES = {
  name:['name','productname','product','title','item','itemname'],
  sku:['sku','code','itemcode','productcode','id'],
  category:['category','dept','department','group','type'],
  supplier:['supplier','vendor','distributor'],
  unit:['unit','uom','size','packsize'],
  price:['price','sellprice','sellingprice','retail','retailprice','unitprice'],
  cost:['cost','costprice','wholesale','buyprice','unitcost'],
  quantity:['quantity','qty','stock','onhand','soh','count','inventory'],
  description:['description','details','about'],
};
function guessMap(headers){
  const norm = v => v.toLowerCase().replace(/[^a-z0-9]/g,'');
  const map = {}, taken = new Set();
  // Exact matches first, so a column called "price" is not claimed by a fuzzy
  // match belonging to another field.
  for (const [f,al] of Object.entries(IMPORT_ALIASES)){
    const hit = headers.find(h => !taken.has(h) && al.includes(norm(h)));
    if (hit){ map[f] = hit; taken.add(hit); }
  }
  // Then partial matches, so "Qty On Hand" still finds quantity.
  for (const [f,al] of Object.entries(IMPORT_ALIASES)){
    if (map[f]) continue;
    const hit = headers.find(h => !taken.has(h) && al.some(x => x.length > 3 && norm(h).includes(x)));
    if (hit){ map[f] = hit; taken.add(hit); }
  }
  return map;
}

function importSku(name){
  // Hash the whole name, not the first few letters. "Marinated Artichokes" and
  // "Marinated Peppers" must not land on the same code.
  let h = 5381;
  const n = name.toLowerCase();
  for (let i = 0; i < n.length; i++) h = ((h * 33) ^ n.charCodeAt(i)) >>> 0;
  return 'IMP-' + h.toString(36).toUpperCase().padStart(6, '0').slice(0, 6);
}

function importPrepare(){
  const st = S.importState;
  const seen = new Map();
  return st.rows.map((r, i) => {
    const g = f => st.map[f] ? (r[st.map[f]] || '').trim() : '';
    const name = g('name');
    let note = null;
    if (!name) note = 'No product name — skipped';
    else if (seen.has(name.toLowerCase())) note = 'Same name as row ' + seen.get(name.toLowerCase());
    else seen.set(name.toLowerCase(), i + 1);
    return {i: i + 1, name, sku: g('sku').toUpperCase(), cat: g('category'),
      price: moneyCents(g('price')), qty: parseInt(g('quantity'), 10),
      skip: !name, note};
  });
}
