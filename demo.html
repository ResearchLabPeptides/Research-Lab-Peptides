    <p class="hint" style="margin-bottom:14px">Only a product name column is required.
      Everything else can be filled in later.</p>
    <div class="panel"><div class="pad">
      <div class="dropzone" id="csvDrop">
        <div style="font-size:26px">⬆</div>
        <p style="font-size:14px;font-weight:700;margin-top:6px">Drop a CSV file here</p>
        <p class="hint">In Excel or Sheets: File → Download → CSV</p>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" class="sr">
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px">
          <button class="btn" data-action="csvPick">Choose a file</button>
          <button class="btn btn-outline" data-action="importSample">Try a sample</button>
          <button class="btn btn-outline" data-action="csvPasteToggle">${st.paste?'Hide paste box':'Paste instead'}</button>
        </div>
      </div>
      ${st.paste?`<div style="margin-top:12px">
        <textarea id="csvIn" rows="6" placeholder="name,price,quantity&#10;Olives,6.49,40"
          style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;
          background:var(--background);font-family:var(--font-mono),monospace;font-size:12px">${esc(st.text||'')}</textarea>
        <button class="btn btn-sm" style="margin-top:8px" data-action="importParsePaste">Read what I pasted</button>
      </div>`:''}
      ${st.error?`<div class="notice notice-err" style="margin-top:12px">${esc(st.error)}</div>`:''}
    </div></div>`;
  }

  // --- step 2: check and import ---
  const rows = importPrepare();
  const ok = rows.filter(r => !r.skip);
  const skipped = rows.length - ok.length;
  const FIELDS = [['name','Product name',1],['sku','SKU'],['category','Category'],['supplier','Supplier'],
    ['unit','Unit'],['price','Selling price'],['cost','Your cost'],['quantity','Opening count'],
    ['description','Description']];
  const nameMissing = !st.map.name;

  return `<div style="margin:16px 0"><button class="btn btn-ghost btn-sm" data-action="importReset">← Choose a different file</button></div>
  <h1 style="font-size:22px;margin-bottom:4px">${esc(st.fileName || 'Your spreadsheet')}</h1>
  <p class="hint" style="margin-bottom:14px">
    <span style="color:var(--primary);font-weight:600">${ok.length} ready to import</span>${
    skipped?` · <span style="color:var(--warning);font-weight:600">${skipped} skipped</span>`:''}</p>

  ${nameMissing?`<div class="notice notice-warn" style="margin-bottom:12px">
    No column looks like a product name. Pick one below before importing.</div>`:''}

  <div class="panel"><h3>Preview</h3><div class="pad">
    <div class="tscroll"><table><thead><tr><th>Row</th><th>Name</th><th>SKU</th><th>Category</th>
      <th style="text-align:right">Price</th><th style="text-align:right">Qty</th><th>Notes</th></tr></thead>
      <tbody>${rows.slice(0,10).map(r=>`<tr${r.skip?' style="opacity:.55"':''}>
        <td class="tabular hint">${r.i}</td>
        <td style="font-weight:600">${esc(r.name)||'—'}</td>
        <td class="mono hint">${esc(r.sku)|| (r.name?importSku(r.name):'—')}</td>
        <td class="hint">${esc(r.cat)||'—'}</td>
        <td class="tabular" style="text-align:right">${r.price!==null&&!isNaN(r.price)?money(r.price):'—'}</td>
        <td class="tabular" style="text-align:right">${!isNaN(r.qty)?r.qty:'—'}</td>
        <td class="hint" style="color:${r.skip?'#b42318':'var(--muted-fg)'}">${r.note?esc(r.note):''}</td>
      </tr>`).join('')}</tbody></table></div>
    ${rows.length>10?`<p class="hint" style="margin-top:8px">…and ${rows.length-10} more rows.</p>`:''}
  </div></div>

  <details class="panel" ${nameMissing?'open':''} style="padding:0">
    <summary style="padding:13px 16px;cursor:pointer;font-weight:700;font-size:15px">Column matching</summary>
    <div class="pad" style="border-top:1px solid var(--border)">
      <p class="hint" style="margin-bottom:10px">Guessed from your headers. Change anything in the wrong place.</p>
      <div class="grid2">${FIELDS.map(([f,label,req])=>`
        <div class="field"><label class="flabel">${label}${req?' <span style="color:#b42318">*</span>':''}</label>
          <select data-imap="${f}"><option value="">Not in my file</option>
          ${st.headers.map(h=>`<option ${st.map[f]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div>
    </div>
  </details>

  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn" data-action="importRun" ${ok.length?'':'disabled'}>Import ${ok.length} products</button>
    <button class="btn btn-outline" data-action="pane" data-p="inv">Cancel</button>
    <span class="hint">Existing SKUs are updated, not duplicated.</span></div>`;
}

function paneCoupons(){
  const f = S.couponForm;
  const preview = describeCoupon({
    kind:f.kind,
    value:f.kind==='percent'?Math.round((parseFloat(f.value)||0)*100):centsIn(f.value),
    cap:f.cap.trim()===''?null:centsIn(f.cap),
    min:f.min.trim()===''?0:centsIn(f.min)});

  const u = S.usdc;
  const poolLeft = u.pool.filter(w=>!w.orderNum && !w.retired).length;
  const usdcLive = usdcAvailable();

  return `<h1 style="font-size:22px;margin:18px 0 4px">Coupons</h1>
  <p class="hint" style="margin-bottom:14px">Discount codes customers enter on the order ticket before checking out.</p>

  <div class="panel"><h3>Crypto payment discount</h3><div class="pad">
    <p class="hint" style="margin-top:0">A standing percentage off for customers who pay in USDC rather than by
      e-Transfer. No code to enter — it applies itself when they pick USDC at checkout, and the saving is shown
      beside the option so they can see why to choose it.</p>

    <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;border:1px solid var(--border);
      border-radius:calc(var(--radius) - 4px);padding:9px 11px;background:var(--background);margin-bottom:12px">
      <input type="checkbox" data-cd="on" ${u.discountOn?'checked':''} ${usdcLive?'':'disabled'} style="margin-top:2px">
      <span style="flex:1;min-width:0">Offer a discount for paying in USDC
        ${usdcLive?'' : `<span class="hint" style="display:block">USDC is not being offered at checkout right now
          ${poolLeft===0?'— the address pool is empty':''}, so this would have no effect.</span>`}</span></label>

    <div class="grid2">
      <div class="field"><label class="flabel">Discount</label>
        <input class="tabular" data-cd="bps" value="${(u.discountBps/100).toFixed(2)}">
        <div class="fhint">Per cent off the goods total. Taken off before tax, so the customer is not
          taxed on money they did not pay.</div></div>
      <div class="field"><label class="flabel">Label on the receipt</label>
        <input data-cd="label" value="${esc(u.discountLabel)}">
        <div class="fhint">What the customer sees on their order summary.</div></div>
      <div class="field"><label class="flabel">Most it can be worth</label>
        <input class="tabular" data-cd="max" value="${u.discountMaxCents?centsOut(u.discountMaxCents):''}"
          placeholder="No limit">
        <div class="fhint">Optional ceiling, so a percentage cannot run away on an unusually large order.</div></div>
      <div class="field"><label class="flabel">With a coupon code</label>
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;border:1px solid var(--border);
          border-radius:calc(var(--radius) - 4px);padding:9px 11px;background:var(--background)">
          <input type="checkbox" data-cd="stacks" ${u.discountStacks?'checked':''} style="margin-top:2px">
          <span style="flex:1;min-width:0">Allow both at once</span></label>
        <div class="fhint">${u.discountStacks
          ? 'A customer using a coupon AND paying in USDC gets both discounts.'
          : 'A coupon wins outright — the customer keeps the better deal they already had.'}</div></div>
    </div>

    ${u.discountOn && u.discountBps>0 ? `<div class="callout" style="margin-top:4px">
      <strong>On a ${money(10000)} order:</strong> an e-Transfer customer pays
      ${money(priceBasket(10000, 0, 0).total)}, a USDC customer pays
      ${money(priceBasket(10000, cryptoDiscount(10000,0), 0).total)}
      — a saving of ${money(cryptoSaving(10000, 0, 0))}, and you receive that much less per
      order. Excludes shipping.</div>` : ''}

    <button class="btn" data-action="saveCryptoDiscount">Save discount settings</button>
  </div></div>

  <div class="panel"><h3>Coupon codes
    ${S.showCouponForm?'':'<button class="btn btn-sm" data-action="addCouponForm">+ New coupon</button>'}</h3>
    <div class="pad">
    ${S.showCouponForm?`<div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px">
      <div class="grid2">
        <div class="field"><label class="flabel">Code</label>
          <input class="mono" data-cf="code" value="${esc(f.code)}" placeholder="WELCOME10"
            style="text-transform:uppercase">
          <div class="fhint">Case and spacing don't matter.</div></div>
        <div class="field"><label class="flabel">What it does</label><select data-cf="kind">
          <option value="percent" ${f.kind==='percent'?'selected':''}>Percentage off the items</option>
          <option value="amount" ${f.kind==='amount'?'selected':''}>Fixed amount off the items</option>
          <option value="ship" ${f.kind==='ship'?'selected':''}>Free shipping</option></select></div></div>
      ${f.kind!=='ship'?`<div class="grid2">
        <div class="field"><label class="flabel">${f.kind==='percent'?'Percentage off':'Amount off'}</label>
          <input class="tabular" data-cf="value" value="${esc(f.value)}"></div>
        ${f.kind==='percent'?`<div class="field"><label class="flabel">Most it can take off</label>
          <input class="tabular" data-cf="cap" value="${esc(f.cap)}" placeholder="15.00">
          <div class="fhint">Optional cap.</div></div>`:'<div></div>'}</div>`:''}
      <div class="grid3">
        <div class="field"><label class="flabel">Minimum order</label>
          <input class="tabular" data-cf="min" value="${esc(f.min)}" placeholder="30.00"></div>
        <div class="field"><label class="flabel">Total uses</label>
          <input class="tabular" data-cf="uses" value="${esc(f.uses)}" placeholder="unlimited"></div>
        <div class="field"><label class="flabel">Uses per customer</label>
          <input class="tabular" data-cf="perCustomer" value="${esc(f.perCustomer)}" placeholder="unlimited"></div></div>
      <div class="grid2">
        <div class="field"><label class="flabel">Last day it works</label>
          <input type="date" data-cf="expires" value="${esc(f.expires)}"></div>
        <div class="field"><label class="flabel">Internal note</label>
          <input data-cf="note" value="${esc(f.note)}" placeholder="Spring flyer"></div></div>
      <p class="notice notice-mute" id="couponPreview"><strong>In plain English:</strong> ${esc(preview)}</p>
      <div style="display:flex;gap:8px"><button class="btn" data-action="saveCoupon">Create coupon</button>
        <button class="btn btn-outline" data-action="cancelCoupon">Cancel</button></div>
    </div>`:''}

    ${S.coupons.length===0 && !S.showCouponForm?'<p class="hint">No coupons yet.</p>':''}
    ${S.coupons.map(cp=>{
      const [state,tone] = couponState(cp);
      const given = S.redemptions.filter(r=>r.couponId===cp.id).reduce((a,r)=>a+r.given,0);
      const left = cp.uses===null?null:Math.max(0,cp.uses-cp.redeemed);
      return `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="min-width:0">
          <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
            <span class="mono" style="font-size:13px;font-weight:700">${esc(cp.code)}</span>
            <span class="pill ${tone}">${state}</span></div>
          <div class="hint">${esc(describeCoupon(cp))}</div>
          <div class="hint"><span class="tabular">${cp.redeemed}</span> used${
            left!==null?` of ${cp.uses} (${left} left)`:' · no limit'}${
            cp.perCustomer!==null?` · max ${cp.perCustomer} per customer`:''}${
            cp.expires?` · ends ${new Date(cp.expires).toLocaleDateString('en-CA')}`:''}${
            given?` · ${money(given)} given away`:''}</div>
          ${cp.note?`<div class="hint">${esc(cp.note)}</div>`:''}</div>
        <div style="display:flex;gap:4px;flex-shrink:0;align-items:flex-start">
          <button class="btn btn-outline btn-sm" data-action="toggleCoupon" data-id="${cp.id}">${cp.active?'Pause':'Resume'}</button>
          <button class="btn btn-ghost btn-sm" data-action="delCoupon" data-id="${cp.id}">Delete</button></div>
      </div>`;}).join('')}
    <div class="callout" style="margin-bottom:0"><strong>A coupon can never pay a customer.</strong>
      A discount bigger than the order is capped at the order, and pausing keeps the
      redemption history so you can still answer what a promotion cost.</div>
  </div></div>`;
}

function panePayments(){
  const u = S.usdc;
  const avail = u.pool.filter(w => !w.orderNum && !w.retired).length;
  const used  = u.pool.filter(w => w.orderNum).length;
  const waiting = S.orders.filter(o => o.payMethod==='usdc' && o.status==='pending_payment');
  const ageH = (Date.now() - u.fetchedAt)/3600000;
  const stale = ageH > u.maxAgeHours;
  const live = usdcAvailable();

  const lines = u.paste.split(/[\s,;]+/).map(l=>l.trim()).filter(Boolean);
  const probs = lines.map((l,i)=>({i, p:addressProblem(l)})).filter(x=>x.p);
  const dupes = lines.filter((l,i)=>lines.indexOf(l)!==i);
  const known = new Set(u.pool.map(w=>w.addr));
  const already = lines.filter(l=>known.has(l));
  let status, ready=false;
  if (!lines.length) status = `<span class="hint">Nothing pasted yet.</span>`;
  else if (probs.length) status = `<span style="color:#b42318">${
    probs.slice(0,4).map(x=>`Line ${x.i+1}: ${esc(x.p)}`).join('<br>')}${
    probs.length>4?`<br>…and ${probs.length-4} more.`:''}</span>`;
  else if (dupes.length) status = `<span style="color:#b42318">That list repeats the same address: ${esc(shortAddr(dupes[0]))}</span>`;
  else if (already.length) status = `<span style="color:#b42318">${esc(shortAddr(already[0]))} is already in the pool.</span>`;
  else { status = `<span style="color:var(--primary)">${lines.length} ${lines.length===1?'address looks':'addresses look'} valid.</span>`; ready=true; }

  return `<div class="stats" style="margin-top:16px">
    <div class="stat ${avail<=u.lowThreshold?'warn':''}"><div class="lbl">Addresses left</div>
      <div class="val tabular">${avail}</div><div class="sub">Unused and not retired</div></div>
    <div class="stat"><div class="lbl">In use</div><div class="val tabular">${used}</div>
      <div class="sub">One per order, never reused</div></div>
    <div class="stat ${waiting.length?'warn':''}"><div class="lbl">Awaiting USDC</div>
      <div class="val tabular">${waiting.length}</div>
      <div class="sub">${fmtUsdc(waiting.reduce((a,o)=>a+o.usdcMicros,0))} USDC</div></div>
    <div class="stat"><div class="lbl">USDC at checkout</div><div class="val">${live?'On':'Off'}</div>
      <div class="sub">${live?'Being offered':(!u.enabled?'Switched off':stale?'Rate too old':'No addresses left')}</div></div>
  </div>

  ${avail===0 && u.enabled ? `<div class="notice notice-warn" style="margin-top:14px">
    <strong>The pool is empty — USDC is not being offered.</strong><br>
    Existing orders are unaffected. New customers see Interac e-Transfer only until you add addresses.</div>`
    : avail<=u.lowThreshold && u.enabled ? `<div class="notice notice-warn" style="margin-top:14px">
    Only ${avail} unused ${avail===1?'address':'addresses'} left. If the pool empties, USDC stops being offered
    and customers see Interac e-Transfer only.</div>` : ''}

  <div class="panel"><h3>Exchange rate</h3><div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <div class="tabular" style="font-size:24px;font-weight:700">1 USDC = ${u.rate.toFixed(4)} CAD</div>
        <div class="hint">${ageH<1?'Updated in the last hour':`Updated about ${Math.round(ageH)} hours ago`} from ${esc(u.source)}.${
          stale?' Too old to quote from — USDC is hidden at checkout until it refreshes.':''}</div>
      </div>
      <button class="btn btn-outline btn-sm" data-action="rateRefresh">Refresh now</button></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
    <div class="grid2">
      <div class="field"><label class="flabel">Markup on the rate (%)</label>
        <input class="tabular" id="u-markup" value="${(u.markupBps/100).toFixed(2)}">
        <div class="fhint">Leave at 0 for the straight converted amount.
          A ${money(5600)} order quotes ${fmtUsdc(usdcMicros(5600,u.rate,u.markupBps))} USDC.</div></div>
      <div class="field"><label class="flabel">Quote holds for (minutes)</label>
        <input class="tabular" id="u-mins" value="${u.quoteMins}"></div>
      <div class="field"><label class="flabel">Warn when addresses drop below</label>
        <input class="tabular" id="u-low" value="${u.lowThreshold}"></div>
      <div class="field"><label class="flabel">Offer USDC at checkout</label>
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;
          border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);
          padding:9px 11px;background:var(--background)">
          <input type="checkbox" id="u-on" ${u.enabled?'checked':''} ${avail?'':'disabled'} style="margin-top:2px">
          <span style="flex:1;min-width:0">${avail
            ? 'Shown beside Interac e-Transfer'
            : 'Add addresses before switching this on'}</span></label></div>
    </div>
    <button class="btn" data-action="saveUsdc">Save payment settings</button></div></div>

  <div class="panel"><h3>Waiting on payment</h3><div class="pad">
    ${waiting.length ? `<div class="tscroll"><table><thead><tr>
      <th>Order</th><th>Customer</th><th>Expecting</th><th>Address</th><th></th></tr></thead><tbody>
      ${waiting.map(o=>`<tr>
        <td><button class="linkbtn mono" data-action="openOrder" data-id="${o.id}">${o.num}</button></td>
        <td>${esc(o.name)}</td>
        <td class="tabular">${fmtUsdc(o.usdcMicros)} USDC</td>
        <td class="mono" style="font-size:11px;word-break:break-all">${esc(o.usdcAddr)}</td>
        <td><button class="btn btn-sm" data-action="openOrder" data-id="${o.id}">Confirm</button></td>
      </tr>`).join('')}</tbody></table></div>
      <p class="hint" style="margin-top:8px">Full addresses are shown so you can search for them in your wallet app.</p>`
    : `<p class="hint">No USDC orders are waiting.</p>`}
  </div></div>

  <div class="panel"><h3>Add payment addresses</h3><div class="pad">
    <p class="hint" style="margin-top:0">These are receiving addresses, not separate wallets — they all belong
      to the one wallet on your phone, so there is nothing per-order to fund or sweep. Generate them in your
      wallet app and paste the public addresses here, one per line.
      <strong>Never paste a seed phrase or a private key</strong> — nothing on this page needs one.</p>
    <div class="field"><textarea id="u-paste" rows="5" class="mono" data-usdcpaste spellcheck="false"
      style="font-size:12px" placeholder="9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM">${esc(u.paste)}</textarea></div>
    <div style="font-size:13px;margin-bottom:10px">${status}</div>
    <button class="btn" data-action="addAddresses" ${ready?'':'disabled'}>Add ${lines.length||''} to the pool</button>
    <div class="notice notice-mute" style="margin-top:12px">A Solana address carries no checksum, so these checks
      catch a bad character set, a wrong length, and about half of single-character slips — but not every one.
      Send a small test payment to the first address before relying on a new batch.</div>
  </div></div>

  <div class="panel"><h3>Receiving addresses <span class="hint">(${u.pool.length})</span></h3><div class="pad">
    <div class="tscroll"><table><thead><tr><th>#</th><th>Address</th><th>Status</th><th></th></tr></thead><tbody>
    ${[...u.pool].sort((a,b)=>b.pos-a.pos).map(w=>`<tr>
      <td class="mono hint">${w.pos}</td>
      <td class="mono" style="font-size:12px" title="${esc(w.addr)}">${esc(shortAddr(w.addr))}</td>
      <td>${w.retired?'<span class="pill p-slate">Retired</span>'
           :w.orderNum?`<span class="pill p-blue">In use · ${esc(w.orderNum)}</span>`
           :'<span class="pill p-green">Available</span>'}</td>
      <td>${!w.retired && !w.orderNum
        ? `<button class="linkbtn" data-action="retireAddress" data-a="${esc(w.addr)}">Retire</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin-top:8px">Every address below belongs to the same wallet on your phone.
      Retiring never deletes a row — an address that carried an order stays readable on that order forever.</p>
  </div></div>`;
}

function paneContent(){
  const groups = {};
  Object.keys(CONTENT_META).forEach(k => {
    const m = CONTENT_META[k]; (groups[m[0]] = groups[m[0]] || []).push([k,m[1],m[2]]);
  });
  return `<h1 style="font-size:22px;margin:18px 0 4px">Content</h1>
  <p class="hint" style="margin-bottom:14px">The words on your storefront. Changes appear immediately.</p>
  <div class="panel"><h3>Pages <button class="btn btn-sm" data-action="newPage">+ New page</button></h3><div class="pad">
    ${S.pages.length===0?'<p class="hint">No pages yet.</p>':S.pages.map(p=>`
      <div style="padding:9px 0;border-bottom:1px solid var(--border)">
        <button class="linkbtn" style="color:var(--primary);font-weight:600;text-decoration:none;font-size:13px"
          data-action="editPage" data-id="${p.id}">${esc(p.title)}</button>
        ${p.published?'<span class="pill p-green">Published</span>':'<span class="pill p-amber">Draft</span>'}
        ${p.inNav?'<span class="pill p-slate">In menu</span>':''}
        <div class="mono hint">/p/${esc(p.slug)}</div></div>`).join('')}
  </div></div>
  ${contentPreviewHTML()}
  <div class="panel"><h3>Wording</h3><div class="pad">
    ${Object.entries(groups).map(([g,items])=>`<div class="sect" style="margin-top:4px">${g}</div>
      ${items.map(([k,label,multi])=>`<div class="field"><label class="flabel">${label}</label>
        ${multi?`<textarea rows="2" data-content="${k}">${esc(contentDraftValue(k))}</textarea>`
          :`<input data-content="${k}" value="${esc(contentDraftValue(k))}">`}</div>`).join('')}`).join('')}
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  const A = {
    go(){ S.view = el.dataset.v; if (S.view==='admin') S.pane = S.role?S.pane:'dash';
      S.track.result = undefined; render(); window.scrollTo(0,0); },
    openDrawer(){ $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); },
    closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); },
    toggleMode(){ S.mode = S.mode==='dark'?'light':'dark'; S.drawerTab = S.mode; save(); render(); },
    reset(){ if (confirm('Reset the demo to its starting state?')){
      try{ localStorage.removeItem(KEY); }catch{} S = seedState(); render(); } },
    preset(){ const v = PRESETS[el.dataset.p];
      S.branding = {light:{...v.light}, dark:{...v.dark}, display:v.display, body:v.body, mono:v.mono, radius:v.radius};
      save(); render(); },
    brandTab(){ S.drawerTab = el.dataset.t; render(); },
    enterSite(){
      const t = S.gateTicked || {};
      if (S.gate.acks.some((a,i) => a.required && !t[i])) return;
      S.gate.accepted = gateVersion(); S.gateTicked = {}; save(); render();
    },
    declineGate(){ toast('In the real shop this sends them to the address you set.', 'warn'); },
    cat(){ S.filters.cat = el.dataset.c; render(); },
    clearFilters(){ S.filters = {cat:'Everything', q:''}; render(); },
    add(){ S.cart[id] = 1; save(); render(); },
    inc(){ const p = S.products.find(x=>x.id===id); S.cart[id] = Math.min((S.cart[id]||0)+1, avail(p)); save(); render(); },
    dec(){ S.cart[id] = (S.cart[id]||0)-1; if (S.cart[id]<=0) delete S.cart[id]; save(); render(); },
    toCheckout(){
      S.railMode='checkout'; S.openRail=true; render();
      // After the re-render, not before it: the rail is rebuilt by render(), so
      // scrolling first would move an element that is about to be replaced.
      // The rail is static in checkout, so without this the form opens below
      // the fold and the first thing anyone does is hunt for it.
      requestAnimationFrame(() => document.querySelector('.rail')
        ?.scrollIntoView({block:'start', behavior:'smooth'})); },
    toItems(){ S.railMode='items'; render(); },
    openRail(){ S.openRail=true; render(); },
    closeRail(){ S.openRail=false; render(); },
    place(){ placeOrder(); },
    openCoupon(){ S.couponOpen = true; render(); },
    applyCoupon(){
      const t = totals();
      const r = evalCoupon(S.couponInput, t.sub, t.baseFee, S.checkout.email);
      if (!r.valid){ S.couponErr = r.msg; render(); return; }
      S.coupon = {code:r.code}; S.couponErr = null; S.couponInput = ''; S.couponOpen = false;
      toast(r.msg); save(); render(); },
    removeCoupon(){ S.coupon = null; S.couponErr = null; S.couponInput = ''; save(); render(); },
    addCouponForm(){ S.showCouponForm = true;
      S.couponForm = {code:'',kind:'percent',value:'10',cap:'',min:'',uses:'',perCustomer:'',expires:'',note:''};
      render(); },
    cancelCoupon(){ S.showCouponForm = false; render(); },
    saveCoupon(){
      const f = S.couponForm, code = normCode(f.code);
      if (code.length < 3){ toast('Codes need at least three characters.','err'); return; }
      if (S.coupons.some(c => c.code === code)){ toast('A coupon with that code already exists.','err'); return; }
      const value = f.kind==='percent' ? Math.round((parseFloat(f.value)||0)*100)
        : f.kind==='amount' ? centsIn(f.value) : 0;
      if (f.kind!=='ship' && value <= 0){ toast('Enter an amount greater than zero.','err'); return; }
      if (f.kind==='percent' && value > 10000){ toast('A percentage cannot exceed 100.','err'); return; }
      S.coupons.unshift({id:uid(), code, kind:f.kind, value,
        cap:f.cap.trim()===''?null:centsIn(f.cap),
        min:f.min.trim()===''?0:centsIn(f.min),
        uses:f.uses.trim()===''?null:parseInt(f.uses,10),
        perCustomer:f.perCustomer.trim()===''?null:parseInt(f.perCustomer,10),
        // A date input means a day, so the code works right through it.
        expires:f.expires?new Date(f.expires+'T23:59:59').getTime():null,
        redeemed:0, active:true, note:f.note.trim()});
      S.showCouponForm = false; toast(`${code} is live.`); save(); render(); },
    toggleCoupon(){ const cp = S.coupons.find(x=>x.id===id); cp.active = !cp.active;
      toast(cp.active?`${cp.code} is accepting orders again.`:`${cp.code} is paused.`); save(); render(); },
    delCoupon(){ const cp = S.coupons.find(x=>x.id===id);
      if (cp.redeemed > 0){
        toast(`${cp.code} has been redeemed ${cp.redeemed} times. Pause it instead so the history survives.`,'err');
        return; }
      if (!confirm(`Delete ${cp.code}?`)) return;
      S.coupons = S.coupons.filter(x=>x.id!==cp.id); toast('Coupon deleted.'); save(); render(); },
    async copy(){ const text = el.dataset.text;
      try { await navigator.clipboard.writeText(text); toast('Copied.'); }
      catch { window.prompt('Copy this:', text); } },
    print(){ window.print(); },
    trackThis(){ const o = S.orders.find(x=>x.id===id);
      S.view='track'; S.track={num:o.num, email:o.email, result:o.id}; render(); window.scrollTo(0,0); },
    lookup(){ const o = S.orders.find(x =>
        x.num.toUpperCase() === S.track.num.trim().toUpperCase() &&
        x.email.toLowerCase() === S.track.email.trim().toLowerCase());
      S.track.result = o ? o.id : null; render(); },
    openPage(){ ev.preventDefault(); S.openPageId = id; S.view='page'; render(); window.scrollTo(0,0); },
    signin(){ S.role = el.dataset.r; S.pane='dash'; save(); render(); },
    signout(){ S.role = null; render(); },
    pane(){ S.pane = el.dataset.p; S.editing=null; S.showRuleForm=false; render(); window.scrollTo(0,0); },
    openOrder(){ S.editing = id; S.pane='order'; render(); window.scrollTo(0,0); },
    pay(){ const c = centsIn($('#payAmt').value); if (c>0) recordPayment(id, c); },

    // --- Futurelite ---------------------------------------------------
    payUsdc(){
      const o = S.orders.find(x => x.id === id); if (!o) return;
      const raw = $('#usdcAmt').value.trim().replace(/,/g,'');
      if (!/^\d+(\.\d{1,6})?$/.test(raw)){
        toast('Enter the USDC amount as a number, for example ' + fmtUsdc(o.usdcMicros) + '.','err'); return; }
      const got = Math.round(parseFloat(raw) * 1e6);
      if (got <= 0){ toast('Enter the amount of USDC that arrived.','err'); return; }
      o.usdcGot = got;
      const short = o.usdcMicros - got;
      // Under by a cent or less counts as paid. Wallets round, and chasing two
      // cents costs more than it recovers.
      if (short > 10000){
        // Credit the CAD ledger proportionally rather than pretending it all landed.
        const credit = Math.min(o.total, Math.round(o.total * got / o.usdcMicros));
        const add = Math.max(0, credit - o.paid);
        o.history.push({s:o.status, at:Date.now(),
          note:`USDC part payment: ${fmtUsdc(got)} of ${fmtUsdc(o.usdcMicros)} received.`});
        o.paid = credit;
        toast(`Recorded as part paid — ${fmtUsdc(short)} USDC short. The order stays on hold.`,'warn');
        save(); render(); return;
      }
      recordPayment(id, o.total - o.paid);
    },
    requote(){
      const o = S.orders.find(x => x.id === id); if (!o) return;
      // The address never changes — only the amount — so a payment already in
      // flight still lands somewhere attributable to this order.
      o.usdcMicros = usdcMicros(o.total, S.usdc.rate, S.usdc.markupBps);
      o.usdcRate = S.usdc.rate;
      o.usdcExpires = Date.now() + S.usdc.quoteMins*60000;
      toast('Amount refreshed — same address.'); save(); render();
    },
    expireQuote(){
      const o = S.orders.find(x => x.id === id); if (!o) return;
      o.usdcExpires = Date.now() - 1; render();

    rateRefresh(){
      // Stands in for the daily CoinGecko fetch. A failed refresh would leave
      // the previous rate untouched and record only the error.
      const drift = 1 + (Math.random() - 0.5) * 0.02;
      S.usdc.rate = Math.round(S.usdc.rate * drift * 10000) / 10000;
      S.usdc.fetchedAt = Date.now();
      toast(`Rate updated: 1 USDC = ${S.usdc.rate.toFixed(4)} CAD.`); save(); render();
    },
    saveUsdc(){
      const avail = S.usdc.pool.filter(w => !w.orderNum && !w.retired).length;
      const on = $('#u-on').checked;
      if (on && !avail){ toast('Add some payment addresses before turning USDC on.','err'); return; }
      const mk = parseFloat($('#u-markup').value);
      if (!isFinite(mk) || mk < 0 || mk > 50){ toast('Enter a markup between 0 and 50%.','err'); return; }
      S.usdc.enabled = on;
      S.usdc.markupBps = Math.round(mk * 100);
      S.usdc.quoteMins = Math.max(1, parseInt($('#u-mins').value, 10) || 15);

    saveCryptoDiscount(){
      const u = S.usdc;
      // Capped at 50% for the same reason the database caps it: a larger figure
      // is far more likely to be a typo than an intention, and the cost of that
      // typo is every order that day going out at a fraction of its price.
      if (u.discountBps < 0 || u.discountBps > 5000){
        toast('Enter a discount between 0% and 50%.','err'); return; }
      if (u.discountOn && u.discountBps === 0){

    addAddresses(){
      const lines = S.usdc.paste.split(/[\s,;]+/).map(l=>l.trim()).filter(Boolean);
      // Validate the whole batch before writing any of it. Part-importing a
      // list invites someone to assume the rest went in too.
      const bad = lines.map((l,i)=>({i,p:addressProblem(l)})).filter(x=>x.p);
      if (bad.length){ toast(`Nothing was added. Line ${bad[0].i+1}: ${bad[0].p}`,'err'); return; }
      const known = new Set(S.usdc.pool.map(w=>w.addr));
      const clash = lines.find(l => known.has(l)) ||
                    lines.find((l,i) => lines.indexOf(l) !== i);
      if (clash){ toast(`${shortAddr(clash)} is already in the pool. Nothing was added.`,'err'); return; }
      let pos = S.usdc.pool.reduce((m,w)=>Math.max(m,w.pos), -1) + 1;
      lines.forEach(a => S.usdc.pool.push({addr:a, pos:pos++, orderNum:null, retired:false}));
      S.usdc.paste = '';
      toast(`Added ${lines.length} address${lines.length===1?'':'es'} to the pool.`);
      save(); render();
    },

    importRun(){
      const st = S.importState;

      let created = 0, updated = 0;
      rows.forEach(r => {

        const g = f => st.map[f] ? (st.rows[r.i-1][st.map[f]]||'').trim() : '';
        const sku = r.sku || importSku(r.name);

        if (existing){
          Object.assign(existing, {name:r.name, cat:g('category')||existing.cat,
            price:r.price ?? existing.price, cost:moneyCents(g('cost')) ?? existing.cost,
            unit:g('unit')||existing.unit, desc:g('description')||existing.desc});
          updated++;
        } else {
          S.products.unshift({id:uid(), sku, name:r.name, cat:g('category')||'Uncategorised',
            desc:g('description')||'', price:r.price||0, was:0, cost:moneyCents(g('cost'))||0,

            featured:false, isNew:false, hue:Math.floor(Math.random()*360), status:'active', img:null});

      const parts = [created?created+' added':'', updated?updated+' updated':''].filter(Boolean);

/* live inputs — targeted updates so typing never loses focus */
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.paymethod){ S.checkout.payMethod = t.dataset.paymethod; render(); }
  if (t.dataset.cd === 'on')     { S.usdc.discountOn = t.checked; render(); }
  if (t.dataset.cd === 'stacks') { S.usdc.discountStacks = t.checked; render(); }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.filter === 'q'){ S.filters.q = t.value;
    const host = $('#results'); if (host) host.innerHTML = gridHTML(); return; }
  if (t.dataset.co){ S.checkout[t.dataset.co] = t.value; delete S.cerr[t.dataset.co]; refreshTotals(); return; }
  if (t.dataset.track){ S.track[t.dataset.track] = t.value; return; }
  if (t.dataset.cd){
    const u = S.usdc, k = t.dataset.cd;
    if (k==='on')     { u.discountOn = t.checked; render(); return; }
    if (k==='stacks') { u.discountStacks = t.checked; render(); return; }
    if (k==='label')  { u.discountLabel = t.value; return; }
    if (k==='bps')    { u.discountBps = Math.round((parseFloat(t.value)||0)*100); return; }
    if (k==='max')    { u.discountMaxCents = t.value.trim()==='' ? 0 : centsIn(t.value); return; }
    return;
  }
  if (t.hasAttribute('data-usdcpaste')){
    // Repaint only the status line, so the caret stays put while typing.
    S.usdc.paste = t.value;
    const sel = t.selectionStart; render();
    const again = document.querySelector('[data-usdcpaste]');
    if (again){ again.focus(); again.setSelectionRange(sel, sel); }
    return; }
  if (t.hasAttribute('data-custq')){ S.customerQuery = t.value;
    const host = document.querySelector('.wrap'); if (host){
      const sel = t.selectionStart; render();
      const again = document.querySelector('[data-custq]');
      if (again){ again.focus(); again.setSelectionRange(sel, sel); } }
    return; }
  if (t.id === 'csvIn'){ S.importState.text = t.value; return; }
  if (t.id === 'mailSubject' || t.id === 'mailBody'){
    const tpl = S.emailTemplates.find(x => x.key === S.emailKey);
    if (t.id === 'mailSubject') tpl.subject = t.value; else tpl.body = t.value;
    // Repaint only the preview, so the caret stays where it is.
    const pane = document.querySelector('.cols');
    if (pane) { const html = paneEmails(); const tmp = document.createElement('div');
      tmp.innerHTML = html; const fresh = tmp.querySelector('.cols');
      if (fresh) pane.querySelectorAll('.panel')[1].replaceWith(fresh.querySelectorAll('.panel')[1]); }
    return; }
  if (t.hasAttribute('data-coupon')){ S.couponInput = t.value; S.couponErr = null; return; }
  if (t.dataset.cf){ S.couponForm[t.dataset.cf] = t.value;
    if (t.dataset.cf === 'kind') render(); else refreshCouponPreview(); return; }
  if (t.dataset.content !== undefined){
    // Into the draft only. The live site keeps the saved wording until Save.
    S.contentDraft[t.dataset.content] = t.value;
    const box = document.querySelector('#contentPreview');
    if (box) box.outerHTML = contentPreviewHTML();
    const count = document.querySelector('#contentCount');
    if (count) count.textContent = contentChangeLabel();
    return; }
  if (t.dataset.rf){ S.ruleForm[t.dataset.rf] = t.value; refreshRulePreview(); return; }
  if (t.dataset.color){ setBrand(t.dataset.color, t.value); return; }
  if (t.dataset.hex && isHex(t.value)){ setBrand(t.dataset.hex, t.value); return; }
  if (t.dataset.font){ S.branding[t.dataset.font] = t.value; save(); applyBranding(); return; }
  if (t.hasAttribute('data-radius')){ S.branding.radius = +t.value; save(); applyBranding();
    const l = $('#radLbl'); if (l) l.textContent = t.value+'px'; return; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.selrow !== undefined){
    const set = new Set(S.selectedProducts || []);
    if (t.checked) set.add(t.dataset.selrow); else set.delete(t.dataset.selrow);
    S.selectedProducts = [...set]; render(); return;
  }
  if (t.hasAttribute('data-selall')){
    S.selectedProducts = t.checked ? S.products.map(p => p.id) : [];

  }
  if (t.id === 'bulkStatus'){ S.bulkStatus = t.value; return; }
  if (t.dataset.gate !== undefined){
    S.gateTicked = S.gateTicked || {};
    S.gateTicked[t.dataset.gate] = t.checked;
    renderGate(); return;
  }
  if (t.dataset.imap !== undefined){
    S.importState.map[t.dataset.imap] = t.value || undefined; render(); return; }
  if (t.dataset.cf && t.tagName === 'SELECT'){ S.couponForm[t.dataset.cf] = t.value; render(); return; }
  if (t.dataset.rf && t.tagName === 'SELECT'){ S.ruleForm[t.dataset.rf] = t.value; render(); return; }
  if (t.id === 'csvFile' && t.files && t.files[0]){ importReadFile(t.files[0]); return; }
  if (t.id === 'photoIn' && t.files && t.files[0]) readPhoto(t.files[0]);

function importLoad(text, fileName){
  const parsed = parseCsvDemo(text || '');
  if (!parsed.headers.length){
    S.importState.error = 'That file has no header row. The first line should name the columns.';
    render(); return;
  }
  if (!parsed.rows.length){
    S.importState.error = 'That file has headers but no products under them.';
    render(); return;
  }
  S.importState = {...S.importState, text, fileName, rows:parsed.rows,
    headers:parsed.headers, map:guessMap(parsed.headers), error:null};
  render(); window.scrollTo(0,0);
}
function importReadFile(file){
  if (!file) return;
  if (file.size > 5*1024*1024){
    S.importState.error = 'That file is over 5 MB. Split it and import in two passes.'; render(); return; }
  const r = new FileReader();
  r.onload = () => importLoad(String(r.result||''), file.name);
  r.onerror = () => { S.importState.error = 'That file could not be read.'; render(); };
  r.readAsText(file);
}
function refreshCouponPreview(){
  const el = document.querySelector('#couponPreview'); if (!el) return;
  const f = S.couponForm;
  el.innerHTML = '<strong>In plain English:</strong> ' + esc(describeCoupon({
    kind:f.kind, value:f.kind==='percent'?Math.round((parseFloat(f.value)||0)*100):centsIn(f.value),
    cap:f.cap.trim()===''?null:centsIn(f.cap), min:f.min.trim()===''?0:centsIn(f.min)}));
}
function refreshRulePreview(){
  const el = $('#rulePreview'); if (!el) return;
  const f = S.ruleForm, moneyAmt = f.effect==='set'||f.effect==='off';
  el.innerHTML = '<strong>In plain English:</strong> ' + describeRule({
    cond:f.cond, threshold:f.cond==='subtotal'?centsIn(f.threshold):parseInt(f.threshold,10)||0,
    effect:f.effect, amount:moneyAmt?centsIn(f.amount):Math.round((parseFloat(f.amount)||0)*100)});
}
function setBrand(key, val){
  S.branding[S.drawerTab][key] = val.toUpperCase();
  save(); applyBranding();
  document.querySelectorAll(`[data-color="${key}"]`).forEach(i => { if (i !== document.activeElement) i.value = val; });
  document.querySelectorAll(`[data-hex="${key}"]`).forEach(i => { if (i !== document.activeElement) i.value = val.toUpperCase(); });
}
/* Replace only the totals block and the mobile bar, so the checkout inputs keep focus. */
function refreshTotals(){
  const rail = document.querySelector('.rail'); if (!rail) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = railFootHTML() + railBarHTML();
  const oldFoot = rail.querySelector('.rail-foot'), newFoot = tmp.querySelector('.rail-foot');
  if (oldFoot && newFoot) oldFoot.replaceWith(newFoot);
  const oldBar = document.querySelector('.railbar'), newBar = tmp.querySelector('.railbar');
  if (oldBar && newBar) oldBar.replaceWith(newBar);
}

function readPhoto(file){
  if (!file.type.startsWith('image/')){ toast('That is not an image file.','err'); return; }
  if (file.size > 5*1024*1024){ toast('That file is over 5 MB. Resize it and try again.','err'); return; }
  const r = new FileReader();
  r.onload = () => { const p = S.products.find(x => x.id === S.editing);
    if (p){ p.img = r.result; toast('Photo added and set as the main image.'); render(); } };
  r.readAsDataURL(file);
}

function saveProductForm(id){
  const g = i => $('#'+i);
  const name = g('f-name').value.trim();
  if (name.length < 2){ toast('Enter a product name.','err'); return; }
  // Name is the only requirement. A blank SKU is filled from the name, the way
  // the database does it, so nothing has to be invented up front.
  const sku = g('f-sku').value.trim().toUpperCase() || importSku(name).replace('IMP-','SKU-');
  if (S.products.some(p => p.sku === sku && p.id !== id)){ toast('Another product already uses that SKU.','err'); return; }
  const price = centsIn(g('f-price').value);
  const was = g('f-was').value.trim() ? centsIn(g('f-was').value) : 0;
  if (was && was <= price){ toast('The "was" price has to be higher than the selling price.','err'); return; }

  const data = {sku, name, cat:g('f-cat').value.trim()||'Uncategorised', desc:g('f-desc').value.trim(),
    price, was, cost:centsIn(g('f-cost').value), unit:g('f-unit').value.trim()||'each',
    min:parseInt(g('f-min').value,10)||0, status:g('f-status').value,
    featured:g('f-feat').checked, isNew:g('f-isnew').checked};

  if (id === 'new'){
    const qty = parseInt(g('f-qty').value,10)||0;
    const p = {id:uid(), ...data, qty, reserved:0, hue:Math.floor(Math.random()*360), img:null};
    S.products.unshift(p); S.editing = p.id;
    toast(`${name} added as ${data.status}.${qty?' Opening count recorded as a receiving movement.':''}`);
  } else {
    Object.assign(S.products.find(x => x.id === id), data);
    toast('Changes saved.');
  }
  save(); render();
}

function syncPageBody(){
  const el = $('#pg-body'); if (!el || S.editing === 'new') return;
  const p = S.pages.find(x => x.id === S.editing); if (p) p.body = el.value;
}
function savePageForm(id){
  const title = $('#pg-title').value.trim();
  if (!title){ toast('Give the page a title.','err'); return; }
  const slug = slugify($('#pg-slug').value.trim() || title);
  const bodyEl = $('#pg-body');
  const body = bodyEl ? bodyEl.value : (S.pages.find(x=>x.id===id)?.body ?? '');
  if (S.pages.some(p => p.slug === slug && p.id !== id)){ toast('Another page already uses that web address.','err'); return; }
  const data = {title, slug, body, published:$('#pg-pub').checked, inNav:$('#pg-nav').checked, order:0};
  if (id === 'new'){ const p = {id:uid(), ...data}; S.pages.push(p); S.editing = p.id; toast('Page created.'); }
  else { Object.assign(S.pages.find(x => x.id === id), data); toast('Page saved.'); }
  save(); render();
}

function mdInsert(kind){
  const el = $('#pg-body'); if (!el) return;
  const s = el.selectionStart, e = el.selectionEnd;
  const sel = el.value.slice(s,e), before = el.value.slice(0,s), after = el.value.slice(e);
  let out, cursor;
  const wrap = (m,ph) => { const inner = sel||ph; out = before+m+inner+m+after; cursor = s+m.length+inner.length+m.length; };
  const pre = (pfx,ph) => { const inner = sel||ph;
    const pad = before && !before.endsWith('\n\n') ? (before.endsWith('\n')?'\n':'\n\n') : '';
    const lines = inner.split('\n').map((l,i) => (typeof pfx==='function'?pfx(i):pfx)+l);
    out = before+pad+lines.join('\n')+after; cursor = out.length-after.length; };
  if (kind==='b') wrap('**','bold text');
  else if (kind==='i') wrap('*','italic text');
  else if (kind==='h') pre('## ','Section heading');
  else if (kind==='ul') pre('- ','List item');
  else if (kind==='ol') pre(i=>`${i+1}. `,'List item');
  else if (kind==='q') pre('> ','Quoted text');
  else { const label = sel||'link text'; out = before+`[${label}](https://example.com)`+after; cursor = s+label.length+3; }
  el.value = out; el.focus(); el.setSelectionRange(cursor,cursor);
  syncPageBody();
}

render();
